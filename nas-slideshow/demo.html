<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Vorschau – Fotowand Selina & Nico</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0c0c0a; overflow: hidden; font-family: 'Jost', sans-serif; }

  .stage { position: fixed; inset: 0; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s ease; }
  .slide.active { opacity: 1; }
  .slide .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(40px) brightness(0.45);
    transform: scale(1.15);
  }
  .slide img {
    position: relative; width: 100%; height: 100%;
    object-fit: contain;
    animation: kenburns 9s ease-out forwards;
  }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.06); } }

  .brand {
    position: fixed; bottom: 22px; right: 28px;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
    font-size: 1rem; color: rgba(255,255,255,0.55);
    z-index: 5; letter-spacing: 0.02em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  .demo-badge {
    position: fixed; top: 22px; left: 28px;
    font-family: 'Jost', sans-serif; font-weight: 400;
    font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: #f2ead8; background: rgba(0,0,0,0.35);
    padding: 8px 16px; border-radius: 999px;
    z-index: 5; text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="demo-badge">Vorschau – so läuft eure Diashow bei der Feier</div>
<div class="stage" id="stage"></div>
<div class="brand">Selina &amp; Nicolai · 12.09.2026</div>

<script>
  // Demo: feste Bilderliste statt list.php-Abfrage wie in der echten Slideshow.
  // Eigene Beispielbilder ergaenzen: Pfad hier eintragen (relativ zu diesem Ordner).
  const DEMO_IMAGES = [
    '../foto.jpeg',
    '../foto2.jpeg',
    '../sektglas.jpeg',
  ];
  const DISPLAY_SECONDS = 6;

  const stage = document.getElementById('stage');
  let index = 0;
  let currentEl = null;

  function showNext() {
    const url = DEMO_IMAGES[index % DEMO_IMAGES.length];
    index++;

    const slide = document.createElement('div');
    slide.className = 'slide';

    const bg = document.createElement('div');
    bg.className = 'bg';
    bg.style.backgroundImage = `url("${url}")`;

    const img = document.createElement('img');
    img.src = url;

    slide.append(bg, img);
    stage.appendChild(slide);
    requestAnimationFrame(() => slide.classList.add('active'));

    const prev = currentEl;
    currentEl = slide;
    if (prev) setTimeout(() => prev.remove(), 1600);

    setTimeout(showNext, DISPLAY_SECONDS * 1000);
  }

  showNext();
</script>

</body>
</html>
