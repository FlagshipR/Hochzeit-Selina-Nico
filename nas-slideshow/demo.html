<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Vorschau – Fotowand Selina & Nico</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --sage: #7a8c6e;
    --sage-light: #a8b89a;
    --sage-pale: #d6e0cc;
    --beige: #f2ead8;
    --brown-light: #9c7e63;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0c0c0a; overflow: hidden; font-family: 'Jost', sans-serif; }

  .stage { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s ease;
    display: grid; gap: 5px;
  }
  .slide.active { opacity: 1; }
  .slide.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .slide.layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .slide.layout-3 { grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr 1fr; }
  .slide.layout-3 .cell:first-child { grid-row: 1 / 3; }

  .cell { position: relative; overflow: hidden; background: #0c0c0a; }
  .cell .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(40px) brightness(0.45);
    transform: scale(1.15);
  }
  .cell img {
    position: relative; width: 100%; height: 100%;
    object-fit: cover;
  }
  .slide.layout-1 .cell img { object-fit: contain; }

  .kb-zoom-in   { animation: kbZoomIn var(--kb-duration, 9s) ease-out forwards; }
  .kb-zoom-out  { animation: kbZoomOut var(--kb-duration, 9s) ease-out forwards; }
  .kb-pan-left  { animation: kbPanLeft var(--kb-duration, 9s) ease-out forwards; }
  .kb-pan-right { animation: kbPanRight var(--kb-duration, 9s) ease-out forwards; }
  @keyframes kbZoomIn   { from { transform: scale(1);    } to { transform: scale(1.08); } }
  @keyframes kbZoomOut  { from { transform: scale(1.08); } to { transform: scale(1);    } }
  @keyframes kbPanLeft  { from { transform: scale(1.1) translateX(2%);  } to { transform: scale(1.1) translateX(-2%); } }
  @keyframes kbPanRight { from { transform: scale(1.1) translateX(-2%); } to { transform: scale(1.1) translateX(2%);  } }

  .brand {
    position: fixed; bottom: 22px; right: 28px;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
    font-size: 1rem; color: rgba(242,234,216,0.6);
    z-index: 5; letter-spacing: 0.02em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  .demo-badge {
    position: fixed; top: 22px; left: 28px;
    font-family: 'Jost', sans-serif; font-weight: 300;
    font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--sage-light);
    border: 1.5px solid var(--sage-light);
    background: rgba(12,12,10,0.4);
    padding: 10px 22px; border-radius: 999px;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="demo-badge">Vorschau – so läuft eure Diashow</div>
<div class="stage" id="stage"></div>
<div class="brand">Selina &amp; Nicolai · 12.09.2026</div>

<!-- Gleicher HEIC-Weg wie slideshow.html (siehe dort fuer die Begruendung
     gegen heic2any): libheif-js lokal eingebunden, kein CDN. -->
<script src="libheif-bundle.js"></script>
<script>
  // Demo: feste Bilderliste statt list.php-Abfrage wie in der echten Slideshow.
  // Eigene Beispielbilder ergaenzen: Datei (auch .heic/.heif) in den
  // sample/-Ordner legen und hier eintragen (Ordner kann nicht automatisch
  // durchsucht werden, da GitHub Pages rein statisch ist, ohne
  // serverseitiges Directory-Listing).
  const DEMO_IMAGES = [
    'sample/foto.jpeg',
    'sample/foto2.jpeg',
    'sample/sektglas.jpeg',
    'sample/1829.HEIC',
    'sample/IMG-20260823-WA0089.jpg',
    'sample/IMG_1474.HEIC',
    'sample/IMG_1904.HEIC',
    'sample/IMG_20250624_163503.jpg',
    'sample/IMG_2209.HEIC',
    'sample/IMG_2285.HEIC',
    'sample/sample_01.jpg',
    'sample/sample_02.jpg',
    'sample/sample_03.jpg',
    'sample/sample_04.jpg',
    'sample/sample_05.jpg',
    'sample/sample_06.jpg',
    'sample/sample_07.jpg',
    'sample/sample_08.jpg',
    'sample/sample_09.jpg',
  ];
  const DISPLAY_SECONDS = 6;
  const KB_VARIANTS = ['kb-zoom-in', 'kb-zoom-out', 'kb-pan-left', 'kb-pan-right'];
  const HEIC_RE = /\.(heic|heif)$/i;
  const resolvedCache = new Map();

  let heifModulePromise = null;
  function getHeifModule() {
    if (!heifModulePromise) heifModulePromise = libheif();
    return heifModulePromise;
  }

  async function resolveUrl(url) {
    if (!HEIC_RE.test(url)) return url;
    if (resolvedCache.has(url)) return resolvedCache.get(url);
    try {
      const mod = await getHeifModule();
      const buf = new Uint8Array(await (await fetch(url)).arrayBuffer());
      const decoder = new mod.HeifDecoder();
      const [image] = decoder.decode(buf);
      const width = image.get_width(), height = image.get_height();

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const raw = await new Promise((resolve, reject) => {
        image.display(ctx.createImageData(width, height), (d) => d ? resolve(d) : reject(new Error('display failed')));
      });
      ctx.putImageData(raw, 0, 0);

      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      const objectUrl = URL.createObjectURL(blob);
      resolvedCache.set(url, objectUrl);
      return objectUrl;
    } catch (e) {
      resolvedCache.set(url, null);
      return null;
    }
  }

  const stage = document.getElementById('stage');
  let index = 0;
  let currentEl = null;

  // Wie in der echten Slideshow: meistens ein Bild, manchmal eine Collage
  // aus 2-3 Bildern, damit die Vorschau dieselbe Abwechslung zeigt.
  function pickGroup() {
    const maxSize = Math.min(3, DEMO_IMAGES.length);
    let size = 1;
    if (maxSize >= 3) {
      const r = Math.random();
      size = r < 0.5 ? 1 : (r < 0.8 ? 2 : 3);
    } else if (maxSize >= 2) {
      size = Math.random() < 0.6 ? 1 : 2;
    }
    const urls = [];
    for (let i = 0; i < size; i++) {
      urls.push(DEMO_IMAGES[index % DEMO_IMAGES.length]);
      index++;
    }
    return urls;
  }

  function buildCell(url) {
    const cell = document.createElement('div');
    cell.className = 'cell';

    const bg = document.createElement('div');
    bg.className = 'bg';
    bg.style.backgroundImage = `url("${url}")`;

    const img = document.createElement('img');
    img.src = url;
    img.className = KB_VARIANTS[Math.floor(Math.random() * KB_VARIANTS.length)];

    cell.append(bg, img);
    return cell;
  }

  async function showNext() {
    const urls = pickGroup();
    const resolved = (await Promise.all(urls.map(resolveUrl))).filter(u => u !== null);
    if (resolved.length === 0) {
      setTimeout(showNext, 500);
      return;
    }

    const slide = document.createElement('div');
    slide.className = `slide layout-${resolved.length}`;
    slide.style.setProperty('--kb-duration', `${DISPLAY_SECONDS + 3}s`);
    resolved.forEach(url => slide.appendChild(buildCell(url)));

    stage.appendChild(slide);
    requestAnimationFrame(() => slide.classList.add('active'));

    const prev = currentEl;
    currentEl = slide;
    if (prev) setTimeout(() => prev.remove(), 1600);

    const displaySeconds = DISPLAY_SECONDS + (resolved.length - 1) * 1.5;
    setTimeout(showNext, displaySeconds * 1000);
  }

  showNext();
</script>

</body>
</html>
