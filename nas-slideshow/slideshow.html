<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Slideshow – Selina & Nico</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --sage: #7a8c6e;
    --sage-light: #a8b89a;
    --sage-pale: #d6e0cc;
    --beige: #f2ead8;
    --brown-light: #9c7e63;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0c0c0a; overflow: hidden; font-family: 'Jost', sans-serif; }

  .stage { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s ease;
    display: grid; gap: 5px;
  }
  .slide.active { opacity: 1; }
  .slide.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .slide.layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .slide.layout-3 { grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr 1fr; }
  .slide.layout-3 .cell:first-child { grid-row: 1 / 3; }

  .cell { position: relative; overflow: hidden; background: #0c0c0a; }
  .cell .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(40px) brightness(0.45);
    transform: scale(1.15);
  }
  .cell img {
    position: relative; width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Bei einem einzelnen Bild lieber nichts abschneiden - dafuer sorgt der
     unscharfe .bg-Layer trotzdem fuer randfuellende Optik. */
  .slide.layout-1 .cell img { object-fit: contain; }

  .kb-zoom-in   { animation: kbZoomIn var(--kb-duration, 9s) ease-out forwards; }
  .kb-zoom-out  { animation: kbZoomOut var(--kb-duration, 9s) ease-out forwards; }
  .kb-pan-left  { animation: kbPanLeft var(--kb-duration, 9s) ease-out forwards; }
  .kb-pan-right { animation: kbPanRight var(--kb-duration, 9s) ease-out forwards; }
  @keyframes kbZoomIn   { from { transform: scale(1);    } to { transform: scale(1.08); } }
  @keyframes kbZoomOut  { from { transform: scale(1.08); } to { transform: scale(1);    } }
  @keyframes kbPanLeft  { from { transform: scale(1.1) translateX(2%);  } to { transform: scale(1.1) translateX(-2%); } }
  @keyframes kbPanRight { from { transform: scale(1.1) translateX(-2%); } to { transform: scale(1.1) translateX(2%);  } }

  .placeholder {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--beige);
  }
  .placeholder .eyebrow {
    font-family: 'Jost', sans-serif; font-weight: 300; letter-spacing: 0.35em;
    font-size: 0.7rem; text-transform: uppercase; color: var(--sage-light); margin-bottom: 14px;
  }
  .placeholder .names { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2.5rem, 7vw, 4rem); }
  .placeholder .names em { font-style: italic; color: var(--sage-light); }
  .placeholder .msg { margin-top: 18px; font-size: 1rem; font-weight: 300; letter-spacing: 0.05em; color: var(--sage-pale); opacity: 0.85; }

  .brand {
    position: fixed; bottom: 22px; right: 28px;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
    font-size: 1rem; color: rgba(242,234,216,0.6);
    z-index: 5; letter-spacing: 0.02em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="placeholder" id="placeholder">
  <div class="eyebrow">Willkommen</div>
  <div class="names"><em>Selina</em> & <em>Nicolai</em></div>
  <div class="msg">Die ersten Fotos kommen gleich &hellip;</div>
</div>

<div class="brand">Selina &amp; Nicolai · 12.09.2026</div>

<script>
  const LIST_URL = 'list.php';
  const DISPLAY_SECONDS = 6;
  const POLL_SECONDS = 12;
  const KB_VARIANTS = ['kb-zoom-in', 'kb-zoom-out', 'kb-pan-left', 'kb-pan-right'];

  const seen = new Set();
  const byUser = new Map();   // user -> { photos: [url, ...], pos: 0 }
  const userOrder = [];       // Reihenfolge, in der Gaeste zum ersten Mal auftauchen
  let userCursor = 0;
  let currentEl = null;
  let showTimer = null;

  const stage = document.getElementById('stage');
  const placeholder = document.getElementById('placeholder');

  async function poll() {
    try {
      const res = await fetch(`${LIST_URL}?_=${Date.now()}`);
      if (!res.ok) return;
      const images = await res.json();
      let added = false;
      for (const img of images) {
        if (seen.has(img.url)) continue;
        seen.add(img.url);
        added = true;
        if (!byUser.has(img.user)) {
          byUser.set(img.user, { photos: [], pos: 0 });
          userOrder.push(img.user);
        }
        byUser.get(img.user).photos.push(img.url);
      }
      if (added && currentEl === null) {
        placeholder.style.display = 'none';
        showNext();
      }
    } catch (e) {
      // Netzwerk-Hänger: naechster Poll versucht's erneut
    }
  }

  // Reihum ein Foto pro Gast statt streng chronologisch - so blockiert niemand,
  // der viele Fotos auf einmal hochlaedt, die Anzeige der anderen Gaeste.
  function pickOne() {
    for (let i = 0; i < userOrder.length; i++) {
      const user = userOrder[userCursor];
      userCursor = (userCursor + 1) % userOrder.length;
      const bucket = byUser.get(user);
      if (bucket.photos.length > 0) {
        const url = bucket.photos[bucket.pos % bucket.photos.length];
        bucket.pos++;
        return url;
      }
    }
    return null;
  }

  function totalAvailable() {
    let n = 0;
    for (const b of byUser.values()) n += b.photos.length;
    return n;
  }

  // Meistens ein Einzelbild, manchmal eine Collage aus 2-3 Bildern - fuer
  // mehr Abwechslung. Faellt automatisch auf weniger Bilder zurueck, wenn
  // (noch) nicht genug einzigartige Fotos da sind.
  function pickGroup() {
    const avail = totalAvailable();
    let size = 1;
    if (avail >= 3) {
      const r = Math.random();
      size = r < 0.5 ? 1 : (r < 0.8 ? 2 : 3);
    } else if (avail >= 2) {
      size = Math.random() < 0.6 ? 1 : 2;
    }
    const urls = [];
    for (let i = 0; i < size; i++) {
      const url = pickOne();
      if (url === null) break;
      urls.push(url);
    }
    return urls;
  }

  function buildCell(url) {
    const cell = document.createElement('div');
    cell.className = 'cell';

    const bg = document.createElement('div');
    bg.className = 'bg';
    bg.style.backgroundImage = `url("${url}")`;

    const img = document.createElement('img');
    img.src = url;
    img.className = KB_VARIANTS[Math.floor(Math.random() * KB_VARIANTS.length)];
    img.onerror = () => cell.remove();

    cell.append(bg, img);
    return cell;
  }

  function showNext() {
    const urls = pickGroup();
    if (urls.length === 0) return;
    clearTimeout(showTimer);

    const slide = document.createElement('div');
    slide.className = `slide layout-${urls.length}`;
    slide.style.setProperty('--kb-duration', `${DISPLAY_SECONDS + 3}s`);
    urls.forEach(url => slide.appendChild(buildCell(url)));

    stage.appendChild(slide);
    requestAnimationFrame(() => slide.classList.add('active'));

    const prev = currentEl;
    currentEl = slide;
    if (prev) setTimeout(() => prev.remove(), 1600);

    const displaySeconds = DISPLAY_SECONDS + (urls.length - 1) * 1.5;
    showTimer = setTimeout(showNext, displaySeconds * 1000);
  }

  poll();
  setInterval(poll, POLL_SECONDS * 1000);
</script>

</body>
</html>
