<!--
  EmailJS-Template für "Helfer der Liebe" (helfer-der-liebe.html)
  ==================================================================
  Im EmailJS-Dashboard (dashboard.emailjs.com) -> Email Templates ->
  Template "template_c0z3nl5" öffnen -> Content-Feld:

    1. In den Code-/Quellcode-Modus wechseln (Symbol </> bzw. Reiter "Code").
    2. ALLES im Editor markieren (Strg+A) und löschen, bevor der neue
       Code eingefügt wird - sonst bleiben alte Blöcke/Reste stehen
       (das war der Grund für die leeren beigen Kästen ganz oben in der
       letzten Version).
    3. Diesen kompletten Code einfügen.
    4. Prüfen, ob es in EmailJS zusätzlich einen separaten "Header" oder
       "Footer" für Templates gibt (oft ein eigener Bereich, unabhängig
       vom Content-Feld) - falls dort noch etwas von früher steht, auch
       dort leeren.

    To email:  {{to_email}}
    Subject:   {{betreff}}

  Variablen: to_email, to_name, betreff, inhalt (siehe sendMail() in
  helfer-der-liebe.html).

  WICHTIG: {{inhalt}} enthält HTML (u.a. eine Aufgaben-Tabelle) und MUSS
  daher mit DREI geschweiften Klammern eingebunden werden: {{{inhalt}}}.
  {{betreff}} und {{to_name}} enthalten nur reinen Text, bewusst bei
  zwei Klammern.

  Layout bewusst als VERSCHACHTELTE <table> statt <div>-Boxen gebaut
  (klassische "bulletproof HTML email"-Technik) - E-Mail-Baukästen wie
  der von EmailJS parsen eingefügten Code oft in eigene "Blöcke" und
  können dabei freie <div>-Strukturen verändern/verwerfen; Tabellen
  überleben diesen Import zuverlässiger.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 480px; margin: 0 auto; font-family: system-ui, sans-serif, Arial; font-size: 14px; color: #3a3228;">
  <tr>
    <td style="background: #f2ead8; padding: 24px; border-left: 4px solid #7a8c6e; border-radius: 10px;">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

        <!-- Header -->
        <tr>
          <td style="font-size: 20px; font-weight: bold; color: #7a8c6e; padding-bottom: 4px;">
            🌿 Helfer der Liebe
          </td>
        </tr>
        <tr>
          <td style="color: #9c7e63; font-size: 13px; padding-bottom: 18px;">
            Hochzeit Selina & Nicolai · 12. September 2026
          </td>
        </tr>

        <!-- Bild: feste Pixel-Größe per HTML-Attribut (nicht nur CSS),
             damit mobile/webbasierte Mail-Clients es nicht auf volle
             Breite hochskalieren -->
        <tr>
          <td style="padding-bottom: 18px;">
            <img
              src="https://flagshipr.github.io/Hochzeit-Selina-Nico/sektglas.jpeg"
              alt="Selina & Nicolai"
              width="90"
              height="90"
              style="width: 90px; height: 90px; max-width: 90px; border-radius: 10px; display: block; object-fit: cover;"
            >
          </td>
        </tr>

        <!-- Betreff-Zeile, hervorgehoben -->
        <tr>
          <td style="background: #faf7f0; border-radius: 8px; padding: 12px 16px; font-weight: bold; color: #3a3228;">
            {{betreff}}
          </td>
        </tr>

        <tr><td style="height: 16px; line-height: 16px; font-size: 0;">&nbsp;</td></tr>

        <!-- Anrede + Inhalt -->
        <tr>
          <td style="background: #faf7f0; border-radius: 8px; padding: 16px 18px; line-height: 1.6;">
            Hallo {{to_name}},
            <br>
            {{{inhalt}}}
          </td>
        </tr>

        <tr><td style="height: 24px; line-height: 24px; font-size: 0;">&nbsp;</td></tr>

        <!-- Footer -->
        <tr>
          <td style="font-size: 12px; color: #a8b89a; text-align: center;">
            🌿 Danke, dass du uns hilfst!<br>
            Diese Nachricht wurde automatisch über die Helfer-der-Liebe-Seite gesendet.
            <div style="font-size: 20px; margin-top: 10px;">❤️</div>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
