<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willkommen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<style>
  :root {
    color-scheme: light;
    --bg: #faf7f2;
    --text: #2b2622;
    --muted: #8a8074;
    --accent: #a9765a;
    --accent-dark: #8a5f47;
    --sage: #74836a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #fff;
    overflow: hidden;
  }
  .slideshow {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .slideshow img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  .slideshow img.active { opacity: 1; }
  .slideshow::after {
    content: "";
    position: absolute;
    inset: 0;
    /* Kein flaechiger Grauschleier mehr - Foto soll seine natuerliche
       Waerme/Kontrast behalten. Nur ein schmaler, weicher Rand oben/unten
       fuer die Textlesbarkeit, die Bildmitte bleibt unangetastet. */
    background: linear-gradient(180deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
  }

  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 24px;
  }
  .top-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    /* Namen sollen unterhalb der Gesichter beginnen, nicht mittig auf der
       ganzen Seite - erst ab knapp der Bildmitte startet der Text-Cluster. */
    padding-top: 44vh;
  }
  .bottom-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding-bottom: 16px;
  }
  .label {
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 1.5px;
    white-space: nowrap;
    text-transform: uppercase;
    text-align: center;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    margin: 0;
    position: fixed;
    z-index: 2;
    top: max(18px, env(safe-area-inset-top));
    left: 0;
    right: 0;
  }
  h1.wedding-name {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: min(15vw, 4.6rem);
    line-height: 1.05;
    color: #fdfbf7;
    text-shadow: 0 2px 18px rgba(0,0,0,0.55);
    margin: 0;
  }
  .amp-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 2px 0;
  }
  .amp-row .rule {
    width: 34px;
    height: 1px;
    background: rgba(255,255,255,0.65);
  }
  .amp-row .amp {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.6rem;
    color: #fdfbf7;
    text-shadow: 0 2px 12px rgba(0,0,0,0.55);
  }
  p.sub {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    margin: 8px 0 0;
    font-size: 1.05rem;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 10px rgba(0,0,0,0.55);
  }
  .corner-olive {
    position: fixed;
    width: min(30vw, 150px);
    height: auto;
    z-index: 1;
    opacity: 0.95;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }
  .corner-olive.top-left { top: 0; left: 0; }
  .corner-olive.bottom-right {
    bottom: 0;
    right: 0;
    transform: rotate(180deg);
  }

  #startBtn {
    background: rgba(116, 131, 106, 0.8);
    color: #fff;
    border: none;
    padding: 14px 30px;
    border-radius: 999px;
    font-size: 1.02rem;
    font-weight: 500;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    transition: background 0.15s, transform 0.15s;
  }
  #startBtn:hover { background: rgba(116, 131, 106, 0.95); transform: scale(1.03); }
  #startBtn:active { transform: scale(0.98); }

  #musicArea {
    display: none;
    width: min(90vw, 420px);
    margin-bottom: 20px;
  }
  #musicArea iframe {
    border-radius: 12px;
    display: block;
    width: 100%;
  }

  #continueBtn {
    display: none;
    margin-top: 8px;
    background: #fff;
    color: var(--accent-dark);
    border: none;
    padding: 14px 30px;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    transition: transform 0.15s;
  }
  #continueBtn:hover { transform: scale(1.03); }
</style>
</head>
<body>
  <div class="slideshow"><img src="slideshow-photos/IMG_5561.jpeg" alt="" class="active"></div>

  <img class="corner-olive top-left" src="olivenzweig-oben.png" alt="">
  <img class="corner-olive bottom-right" src="olivenzweig-unten.png" alt="">
  <p class="label">Unsere Hochzeit · 12.09.2026</p>

  <div class="content">
    <div class="top-group">
      <h1 class="wedding-name">Selina</h1>
      <div class="amp-row"><span class="rule"></span><span class="amp">&amp;</span><span class="rule"></span></div>
      <h1 class="wedding-name">Nicolai</h1>
      <p class="sub">Schön, dass du dabei warst. ♥</p>

      <button id="startBtn">▶ Musik &amp; Fotos starten</button>
    </div>

    <div class="bottom-group">
      <div id="musicArea">
        <div id="embed-iframe" style="border-radius:12px; overflow:hidden;"></div>
      </div>

      <a id="continueBtn" href="./">Jetzt eigene Fotos hochladen →</a>
    </div>
  </div>

<script>
  // Nur noch EIN festes Hero-Foto auf dieser Seite (Nutzerwunsch: "genau
  // das Bild", IMG_5563 - die Stirnkuss-Aufnahme vor der Holztuer), keine
  // Rotation mehr hier. Die rotierende Slideshow mit allen Gaeste-/
  // Fotobox-Bildern lebt jetzt stattdessen auf Seite 2 (index.html).
  const SPOTIFY_PLAYLIST_ID = '0efAXCBOjiHjHb1EQ1ssuB';
  const START_AT_SECONDS = 41;

  // Spotifys einfaches iframe-Embed kennt keinen Start-Zeitpunkt ueber die
  // URL - dafuer gibt's die offizielle Spotify IFrame API (oben im <head>
  // eingebunden), die einen steuerbaren Controller liefert (play/seek).
  // Der Controller wird gleich beim Laden erstellt (still, noch nicht
  // abspielend), damit er beim Klick sofort bereit ist - "wantsToPlay"
  // faengt den Fall ab, dass der Nutzer schneller klickt, als die API
  // (asynchron von Spotify nachgeladen) fertig initialisiert ist.
  let spotifyController = null;
  let wantsToPlay = false;

  window.onSpotifyIframeApiReady = (IFrameAPI) => {
    IFrameAPI.createController(
      document.getElementById('embed-iframe'),
      { uri: `spotify:playlist:${SPOTIFY_PLAYLIST_ID}`, width: '100%', height: '152' },
      (EmbedController) => {
        spotifyController = EmbedController;
        if (wantsToPlay) {
          spotifyController.seek(START_AT_SECONDS);
          spotifyController.play();
        }
      }
    );
  };

  // Musik startet erst nach echtem Klick (Nutzer-Geste) - Browser blockieren
  // Autoplay mit Ton sonst grundsaetzlich, das laesst sich nicht per Code
  // umgehen, auch nicht mit der IFrame API.
  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('musicArea').style.display = 'block';
    document.getElementById('continueBtn').style.display = 'inline-block';
    document.getElementById('startBtn').style.display = 'none';
    wantsToPlay = true;
    if (spotifyController) {
      spotifyController.seek(START_AT_SECONDS);
      spotifyController.play();
    }
  });
</script>
</body>
</html>
